<style>
  :root{
    --navy:#1a2a6c; --blue:#4a90d9; --gold:#ECC023; --red:#C00000;
    --ink:#1c2430; --sub:#5b6470; --line:#e3e7ee; --bg:#f5f7fb; --card:#fff;
    --pad:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e8ecf3; --sub:#9aa4b2; --line:#2a3446; --bg:#0f141c; --card:#171e29; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:"Yu Gothic Medium","Yu Gothic","游ゴシック",system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    padding:max(12px,env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom));
    max-width:640px; margin:0 auto; font-size:15px; line-height:1.5;
  }
  h1{font-size:18px; margin:4px 2px 12px; display:flex; align-items:center; gap:8px}
  h1 .mode{font-size:12px; font-weight:700; padding:2px 10px; border-radius:999px; color:#fff}
  .mode.cut{background:var(--blue)} .mode.bulk{background:var(--gold); color:var(--navy)} .mode.flat{background:var(--sub)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:var(--pad); margin-bottom:12px}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end}
  label{font-size:12px; color:var(--sub); display:block; margin-bottom:3px}
  input[type=date],input[type=number],input[type=text]{
    font:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:9px;
    background:var(--bg); color:var(--ink); width:100%;
  }
  input[type=number]{font-variant-numeric:tabular-nums}
  /* ラベルを左に置いて1行にまとめる（日付／体重・体脂肪率 の2行） */
  .inline{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
  /* ラベルも入力欄も本文と同じ文字サイズに揃える */
  .inline label{margin:0; flex:0 0 auto; white-space:nowrap; font-size:inherit}
  .inline input[type=number]{flex:1 1 76px; min-width:0}
  .inline input[type=date]{flex:0 0 auto; width:auto}
  button{font:inherit; font-weight:700; border:0; border-radius:9px; padding:10px 14px; cursor:pointer}
  .primary{background:var(--navy); color:#fff}
  .ghost{background:transparent; color:var(--blue); border:1px solid var(--line); font-weight:600; padding:7px 11px}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .stat{background:var(--bg); border-radius:10px; padding:10px 8px; text-align:center}
  .stat .v{font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.3px}
  .stat .u{font-size:11px; color:var(--sub); font-weight:400}
  .stat .k{font-size:11px; color:var(--sub); margin-top:2px}
  .stat.hl{background:linear-gradient(180deg,rgba(74,144,217,.14),rgba(74,144,217,.05))}
  .stat .v.warn{color:var(--red)}
  .seg{display:inline-flex; background:var(--bg); border-radius:9px; padding:3px; gap:2px; flex-wrap:wrap}
  .seg button{background:transparent; color:var(--sub); font-weight:600; padding:6px 11px; border-radius:7px; font-size:13px}
  .seg button.on{background:var(--card); color:var(--navy); box-shadow:0 1px 2px rgba(0,0,0,.08)}
  @media (prefers-color-scheme: dark){ .seg button.on{color:var(--blue)} }
  .chartwrap{position:relative; width:100%; height:230px; margin-top:10px}
  canvas{width:100%; height:100%; display:block}
  .pace{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
  .pill{font-size:12px; padding:5px 10px; border-radius:999px; background:var(--bg); color:var(--sub)}
  .pill b{color:var(--ink); font-variant-numeric:tabular-nums}
  /* 記録一覧は列が多い。狭い画面ではページ全体を広げず、表の中だけ横スクロールさせる */
  #list{overflow-x:auto; -webkit-overflow-scrolling:touch}
  table{width:100%; min-width:302px; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:13px}
  th,td{text-align:right; padding:6px 5px; border-bottom:1px dotted var(--line); white-space:nowrap}
  th{color:var(--sub); font-weight:600; font-size:12px; text-align:right}
  th:first-child,td:first-child{text-align:left}
  td .del{color:var(--sub); background:transparent; padding:2px 8px; font-weight:400; font-size:16px; line-height:1}
  .muted{color:var(--sub); font-size:13px}
  details summary{cursor:pointer; color:var(--blue); font-size:13px; font-weight:600; list-style:none}
  details summary::-webkit-details-marker{display:none}
  .setgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  /* 一番上は最新値。手入力は折りたたみの中 */
  .latest{display:flex; align-items:baseline; gap:4px 10px; flex-wrap:wrap}
  .latest .big{font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.5px}
  .latest .u{font-size:13px; color:var(--sub)}
  .latest .when{font-size:13px; color:var(--sub); margin-left:auto}
  .empty{text-align:center; color:var(--sub); padding:20px 0; font-size:13px}
</style>
</head>
<body>

<h1>Weight-Tracker <span id="mode" class="mode flat">—</span></h1>

<!-- 入力 -->
<div class="card">
  <div class="latest" id="latest"></div>
  <div class="toolbar">
    <button class="ghost" id="sync">体組成計から取り込む</button>
  </div>
  <div class="muted" id="hint" style="margin-top:8px"></div>
  <details style="margin-top:10px">
    <summary>手で入力する</summary>
    <div class="inline" style="margin-top:10px">
      <label for="i-date">日付</label>
      <input type="date" id="i-date">
    </div>
    <div class="inline">
      <label for="i-w">体重</label>
      <input type="number" id="i-w" inputmode="decimal" step="0.05" placeholder="59.20">
      <label for="i-f">体脂肪率</label>
      <input type="number" id="i-f" inputmode="decimal" step="0.1" placeholder="10.0">
      <button class="primary" id="add">記録</button>
    </div>
  </details>
</div>

<!-- サマリ -->
<div class="card">
  <div class="stats" id="stats"></div>
  <div class="pace" id="pace"></div>
</div>

<!-- グラフ -->
<div class="card">
  <div class="row" style="justify-content:space-between; align-items:center">
    <div class="seg" id="metric">
      <button data-m="w" class="on">体重</button>
      <button data-m="f">体脂肪</button>
      <button data-m="lbm">除脂肪</button>
      <button data-m="ffmi">FFMI</button>
    </div>
    <div class="seg" id="gran">
      <button data-g="d">日次</button>
      <button data-g="w" class="on">7日平均</button>
      <button data-g="m">月平均</button>
    </div>
  </div>
  <div class="row" style="justify-content:space-between; align-items:center; margin-top:8px">
    <div class="seg" id="range">
      <button data-r="m1">1ヶ月</button>
      <button data-r="m3">3ヶ月</button>
      <button data-r="m6">6ヶ月</button>
      <button data-r="y1">1年</button>
      <button data-r="all" class="on">全部</button>
    </div>
  </div>
  <div class="muted" id="period" style="margin-top:8px"></div>
  <div class="chartwrap"><canvas id="chart"></canvas></div>
</div>

<!-- 一覧 -->
<div class="card">
  <details open>
    <summary>記録一覧 <span class="muted" id="count"></span></summary>
    <div id="list" style="margin-top:10px"></div>
  </details>
</div>

<!-- 設定 & バックアップ -->
<div class="card">
  <details>
    <summary>設定・バックアップ</summary>
    <div class="setgrid">
      <div><label>身長 cm</label><input type="number" id="s-h" step="0.1"></div>
      <div><label>上限体重 kg</label><input type="number" id="s-wmax" step="0.5"></div>
      <div><label>上限体脂肪 %</label><input type="number" id="s-fmax" step="0.5"></div>
      <div><label>目標FFMI</label><input type="number" id="s-ffmi" step="0.1"></div>
      <div style="grid-column:1/-1"><label>ショートカット名（取り込み用）</label><input type="text" id="s-sc" placeholder="体重取得"></div>
    </div>
    <div class="toolbar">
      <button class="ghost" id="save-set">設定を保存</button>
      <button class="ghost" id="export">CSV書き出し</button>
      <label class="ghost" style="display:inline-flex;align-items:center;cursor:pointer">
        CSV読み込み<input type="file" id="import" accept=".csv" hidden>
      </label>
    </div>
    <div class="muted" style="margin-top:10px">
      データはこの端末（ブラウザ）にのみ保存されます。機種変・バックアップはCSV書き出しで。
    </div>
  </details>
</div>

<script>
"use strict";
const KEY="wt_data", SKEY="wt_settings";
// 既定値は一般的な値。自分の身長・目標は「設定」で入れる（この端末に保存される）。
const DEF_SET={ h:170, wmax:75, fmax:20, ffmi:20, sc:"体重取得" };

let data = load(KEY, []);          // [{date:"YYYY-MM-DD", w:Number, f:Number|null}]
let set  = Object.assign({}, DEF_SET, load(SKEY, {}));
let metrics=["w"], gran="w", range="all";   // グラフに出す項目（最大2）

function load(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } }
function store(){ localStorage.setItem(KEY, JSON.stringify(data)); localStorage.setItem(SKEY, JSON.stringify(set)); }
const r2=x=>Math.round(x*100)/100, r1=x=>Math.round(x*10)/10;
const hm = ()=> set.h/100;

// ---- 派生量 ----
function lbm(e){ return e.f==null? null : e.w*(1-e.f/100); }              // 除脂肪 kg
function ffmi(e){ const l=lbm(e); return l==null? null : l/(hm()*hm()); } // 素のFFMI
function val(e,m){ return m==="w"?e.w : m==="f"?e.f : m==="lbm"?lbm(e) : ffmi(e); }
const M_LABEL={w:"体重",f:"体脂肪",lbm:"除脂肪",ffmi:"FFMI"};
const M_UNIT ={w:"kg",f:"%",lbm:"kg",ffmi:""};
// canvas は body の font-family を継承しないので、同じ指定を明示的に持つ
const CFONT='"Yu Gothic Medium","Yu Gothic","游ゴシック",system-ui,sans-serif';

// ---- 集計 ----
function isoWeekKey(d){ // 月曜起点。"YYYY-Www" と週の月曜日付を返す
  const t=new Date(d+"T00:00:00"); const day=(t.getDay()+6)%7; t.setDate(t.getDate()-day);
  const y=t.getFullYear(), m=String(t.getMonth()+1).padStart(2,"0"), dd=String(t.getDate()).padStart(2,"0");
  return `${y}-${m}-${dd}`; // その週の月曜日（ソート・表示に使える）
}
function monthKey(d){ return d.slice(0,7)+"-01"; }
// グラフに映す期間（直近N日）。最新の記録を基準にする（今日でなく）
const RANGE_DAYS={m1:30, m3:90, m6:182, y1:365};
function latestDate(){
  return data.length ? data.reduce((a,e)=>e.date>a?e.date:a, data[0].date) : todayStr();
}
function visibleData(){
  const days=RANGE_DAYS[range];
  if(!days || !data.length) return data;
  // 起点は今日。ただしその期間に記録が1件も無ければ、最新の記録から遡る（空にしない）
  let out=data.filter(e=>e.date>=addDays(todayStr(), -days));
  if(!out.length) out=data.filter(e=>e.date>=addDays(latestDate(), -days));
  return out;
}

function groupAvg(g, m, rows){
  const keyf = g==="w"?isoWeekKey : g==="m"?monthKey : (d=>d);
  const bins={};
  for(const e of (rows||data)){
    const v=val(e,m); if(v==null) continue;
    const k=keyf(e.date); (bins[k]??=[]).push(v);
  }
  return Object.keys(bins).sort().map(k=>({date:k, v:bins[k].reduce((a,b)=>a+b,0)/bins[k].length, n:bins[k].length}));
}
// 7日移動平均。その日を含む直近7日の「実測」の平均。
// 測っていない日には点を作らない（無い値を作らないため）。n＝その平均に使った実測の数。
function movingAvg(m, src, win){
  const s=dailySeries(m, src);                       // 実測のみ・昇順
  const T=d=>+new Date(d+"T00:00:00");
  const out=[];
  for(let i=0;i<s.length;i++){
    const from=T(s[i].date)-(win-1)*86400000;
    let sum=0, n=0;
    for(let j=i;j>=0;j--){ if(T(s[j].date)<from) break; sum+=s[j].v; n++; }
    out.push({date:s[i].date, v:sum/n, n});
  }
  return out;
}
// 表示する期間で切り出す。平均そのものは全データから計算する（期間の左端が痩せないように）
function movingInRange(m, rows, win){
  if(!rows.length) return [];
  let from=rows[0].date;
  for(const e of rows) if(e.date<from) from=e.date;
  return movingAvg(m, data, win).filter(p=>p.date>=from);
}

// 直近N件の平均（生データ・降順の先頭から）
function recentAvg(m, days){
  const cutoff=addDays(todayStr(), -days);
  const vs=data.filter(e=>e.date>=cutoff).map(e=>val(e,m)).filter(v=>v!=null);
  return vs.length? vs.reduce((a,b)=>a+b,0)/vs.length : null;
}
function todayStr(){ const t=new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`; }
function addDays(s,n){ const t=new Date(s+"T00:00:00"); t.setDate(t.getDate()+n); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`; }

// 週平均系列から線形回帰の傾き（単位/週）
function slopePerWeek(m){
  const s=groupAvg("w",m); if(s.length<2) return null;
  const pts=s.slice(-6); // 直近6週
  const n=pts.length; let sx=0,sy=0,sxx=0,sxy=0;
  pts.forEach((p,i)=>{ sx+=i; sy+=p.v; sxx+=i*i; sxy+=i*p.v; });
  const d=n*sxx-sx*sx; if(!d) return null;
  return (n*sxy-sx*sy)/d; // 1週あたりの変化
}

// ---- 描画 ----
function render(){
  data.sort((a,b)=>a.date<b.date?1:-1); // 一覧は新しい順
  renderMode(); renderLatest(); renderStats(); renderPace(); renderList(); drawChart();
  store();
}

function renderMode(){
  const sl=slopePerWeek("w"); const el=document.getElementById("mode");
  if(sl==null){ el.className="mode flat"; el.textContent="—"; return; }
  if(sl<-0.05){ el.className="mode cut"; el.textContent=`減量 ${r2(sl)}kg/週`; }
  else if(sl>0.05){ el.className="mode bulk"; el.textContent=`増量 +${r2(sl)}kg/週`; }
  else { el.className="mode flat"; el.textContent="維持"; }
}

// 一番上＝最新の記録（手入力は折りたたみの中なので、ここは見るだけ）
function renderLatest(){
  const el=document.getElementById("latest");
  const e=data[0];                                   // data は新しい順
  if(!e){ el.innerHTML=`<span class="muted">まだ記録がありません</span>`; return; }
  el.innerHTML=`<span class="big">${r2(e.w)}</span><span class="u">kg</span>`
    + (e.f!=null ? `<span class="big">${r1(e.f)}</span><span class="u">%</span>` : "")
    + `<span class="when">${e.date.slice(0,4)}/${+e.date.slice(5,7)}/${+e.date.slice(8,10)}</span>`;
}

function renderStats(){
  const latest=data[0]; // 新しい順の先頭
  const wWeek=recentAvg("w",7), wMonth=recentAvg("w",30), fWeek=recentAvg("f",7);
  const l = latest?lbm(latest):null, fi = latest?ffmi(latest):null;
  const wRoom = wWeek!=null? set.wmax-wWeek : null;   // 上限体重までの余裕（週平均基準）
  const cells=[
    ["週平均", wWeek!=null?r2(wWeek):"—", "kg", "直近7日", true],
    ["月平均", wMonth!=null?r2(wMonth):"—", "kg", "直近30日", true],
    ["体脂肪", fWeek!=null?r1(fWeek):"—", "%", "直近7日", true],
    ["除脂肪", l!=null?r2(l):"—", "kg", latest&&latest.f!=null?"":"要 体脂肪", false],
    ["FFMI", fi!=null?r1(fi):"—", "", `目標 ${set.ffmi}`, false],
    ["上限まで", wRoom!=null?(wRoom>=0?r2(wRoom):r2(wRoom)):"—", "kg", `${set.wmax}kg`, false, wRoom!=null&&wRoom<0],
  ];
  document.getElementById("stats").innerHTML = cells.map(c=>`
    <div class="stat${c[4]?' hl':''}">
      <div class="v${c[5]?' warn':''}">${c[1]}<span class="u">${c[2]}</span></div>
      <div class="k">${c[0]} · ${c[3]}</div>
    </div>`).join("");
}

function renderPace(){
  const el=document.getElementById("pace"); const p=[];
  const sw=slopePerWeek("w");
  if(sw!=null){
    p.push(`直近ペース <b>${sw>=0?'+':''}${r2(sw)}</b> kg/週`);
    p.push(`＝月 <b>${sw>=0?'+':''}${r2(sw*4.345)}</b> kg`);
  }
  // 月平均の前月差
  const ms=groupAvg("m","w");
  if(ms.length>=2){ const d=ms[ms.length-1].v-ms[ms.length-2].v;
    p.push(`前月比 <b>${d>=0?'+':''}${r2(d)}</b> kg`); }
  // 計画の目安（年1.33kg=月0.11kg）
  if(sw!=null){ const perMonth=sw*4.345;
    const tag = Math.abs(perMonth)<=0.2? "計画ペース内" : (perMonth>0.2? "増加が速い" : "減少が速い");
    p.push(`<b>${tag}</b>（目安 ±0.11kg/月）`); }
  el.innerHTML = p.map(t=>`<span class="pill">${t}</span>`).join("");
}

function renderList(){
  const el=document.getElementById("list");
  document.getElementById("count").textContent = data.length? `（${data.length}件）` : "";
  if(!data.length){ el.innerHTML=`<div class="empty">まだ記録がありません。毎朝トイレ後・同じ条件で1つ入れていきましょう。</div>`; return; }
  const rows=data.slice(0,60).map(e=>{
    const l=lbm(e), fi=ffmi(e);
    return `<tr>
      <td>${e.date}</td>
      <td>${r2(e.w)}</td>
      <td>${e.f!=null?r1(e.f):"–"}</td>
      <td>${l!=null?r2(l):"–"}</td>
      <td>${fi!=null?r1(fi):"–"}</td>
      <td><button class="del" data-d="${e.date}">×</button></td>
    </tr>`;}).join("");
  el.innerHTML=`<table>
    <tr><th>日付</th><th>体重</th><th>体脂肪</th><th>除脂肪</th><th>FFMI</th><th></th></tr>
    ${rows}</table>` + (data.length>60?`<div class="muted" style="margin-top:6px">直近60件を表示</div>`:"");
}

// ---- canvas 折れ線（最大2系列・単位が違えば左右2軸） ----
function drawChart(){
  const cv=document.getElementById("chart"); const wrap=cv.parentElement;
  const dpr=window.devicePixelRatio||1;
  const W=wrap.clientWidth, H=wrap.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr;
  const c=cv.getContext("2d"); c.scale(dpr,dpr); c.clearRect(0,0,W,H);
  const css=getComputedStyle(document.body);
  const col={ ink:css.getPropertyValue('--ink').trim(), sub:css.getPropertyValue('--sub').trim(),
              line:css.getPropertyValue('--line').trim(), blue:css.getPropertyValue('--blue').trim(),
              navy:css.getPropertyValue('--navy').trim(), red:css.getPropertyValue('--red').trim(),
              gold:css.getPropertyValue('--gold').trim(), card:css.getPropertyValue('--card').trim() };
  // ダークのときネイビーは沈むのでブルーで描く
  const dark=matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
  const C1=dark?col.blue:col.navy, C2=col.gold;

  const rows=visibleData();
  const LIM={w:()=>set.wmax, f:()=>set.fmax, ffmi:()=>set.ffmi};
  const ss=metrics.map((m,i)=>({
    m, unit:M_UNIT[m], label:M_LABEL[m], color:(i===0?C1:C2),
    pts: gran==="d" ? dailySeries(m,rows)
       : gran==="w" ? movingInRange(m,rows,7)        // 7日移動平均（欠測を自然に吸収する）
       : groupAvg("m",m,rows),
    daily: dailySeries(m,rows),
    limit: LIM[m] ? LIM[m]() : null,
  })).filter(s=>s.pts.length);

  if(!ss.length){
    c.fillStyle=col.sub; c.font="13px "+CFONT; c.textAlign="center";
    c.fillText("データを入れるとグラフが出ます", W/2, H/2);
    renderPeriod(null,null); return;
  }

  const twoAxis = ss.length===2 && ss[0].unit!==ss[1].unit;
  const pad={l:38, r:(twoAxis?40:10), t:(ss.length>1?24:12), b:22};
  const gx=pad.l, gw=W-pad.l-pad.r, gy=pad.t, gh=H-pad.t-pad.b;

  // X は「点の順番」でなく日付で置く。順番だと欠測があるときラベルの間隔が不揃いになる
  const T=d=>+new Date(d+"T00:00:00");
  let t0=Infinity, t1=-Infinity;
  ss.forEach(s=>s.pts.forEach(p=>{ const v=T(p.date); if(v<t0)t0=v; if(v>t1)t1=v; }));
  const span=(t1-t0)||0;
  const X=d=> span? gx+gw*((T(d)-t0)/span) : gx+gw/2;

  // 軸の値域（単位が同じ系列は1つの軸を共有する）
  function scaleOf(list){
    let vals=[];
    list.forEach(s=>{
      vals=vals.concat(s.pts.map(p=>p.v));
      if(gran!=="d") vals=vals.concat(s.daily.map(p=>p.v));
      if(s.limit!=null) vals.push(s.limit);
    });
    let mn=Math.min(...vals), mx=Math.max(...vals);
    if(mn===mx){ mn-=1; mx+=1; }
    const pv=(mx-mn)*0.12; mn-=pv; mx+=pv;
    return {mn, mx, Y:v=> gy+gh*(1-(v-mn)/(mx-mn))};
  }
  const axL = scaleOf(twoAxis? [ss[0]] : ss);
  const axR = twoAxis? scaleOf([ss[1]]) : null;
  ss.forEach((s,i)=> s.ax = (twoAxis && i===1) ? axR : axL);

  // グリッドと Y ラベル
  c.font="10px "+CFONT; c.textBaseline="middle";
  for(let i=0;i<=4;i++){
    const y=gy+gh*(1-i/4);
    c.strokeStyle=col.line; c.lineWidth=1; c.beginPath(); c.moveTo(gx,y); c.lineTo(gx+gw,y); c.stroke();
    c.textAlign="right"; c.fillStyle=twoAxis?ss[0].color:col.sub;
    c.fillText(r1(axL.mn+(axL.mx-axL.mn)*i/4), gx-6, y);
    if(twoAxis){
      c.textAlign="left"; c.fillStyle=ss[1].color;
      c.fillText(r1(axR.mn+(axR.mx-axR.mn)*i/4), gx+gw+6, y);
    }
  }

  // 上限ライン（1つ目の系列のものだけ。2本出すと読みにくい）
  const s0=ss[0];
  if(s0.limit!=null && s0.limit>=s0.ax.mn && s0.limit<=s0.ax.mx){
    const y=s0.ax.Y(s0.limit);
    c.strokeStyle=col.red; c.lineWidth=1.5; c.setLineDash([5,4]);
    c.beginPath(); c.moveTo(gx,y); c.lineTo(gx+gw,y); c.stroke(); c.setLineDash([]);
    c.fillStyle=col.red; c.textAlign="left"; c.textBaseline="bottom";
    c.fillText("上限 "+r1(s0.limit), gx+2, y-3); c.textBaseline="middle";
  }

  // 均した線を見ているときは、日々の点を背景に薄く出す
  if(gran!=="d") ss.forEach(s=>{
    c.fillStyle=s.color+"33";
    s.daily.forEach(p=>{ c.beginPath(); c.arc(X(p.date), s.ax.Y(p.v), 2, 0, 7); c.fill(); });
  });

  // 線と点
  ss.forEach(s=>{
    c.strokeStyle=s.color; c.lineWidth=2.4; c.lineJoin="round"; c.beginPath();
    s.pts.forEach((p,i)=>{ const x=X(p.date), y=s.ax.Y(p.v); i?c.lineTo(x,y):c.moveTo(x,y); });
    c.stroke();
    // 実測が少ない点は薄くする（週に2日しか測っていない、が見て分かるように）
    s.pts.forEach(p=>{
      c.fillStyle = (p.n!=null && p.n<4) ? s.color+"66" : s.color;
      c.beginPath(); c.arc(X(p.date), s.ax.Y(p.v), 3, 0, 7); c.fill();
    });
  });

  // X ラベル（時間で等間隔に5個）
  c.fillStyle=col.sub; c.font="10px "+CFONT; c.textBaseline="top";
  const fmtX=ms=>{ const d=new Date(ms);
    return gran==="m" ? d.getFullYear()+"/"+(d.getMonth()+1) : (d.getMonth()+1)+"/"+d.getDate(); };
  for(let i=0;i<5;i++){
    c.textAlign = i===0?"left" : i===4?"right" : "center";
    c.fillText(fmtX(t0+span*i/4), gx+gw*i/4, gy+gh+4);
  }

  // 凡例（2系列のとき）
  if(ss.length>1){
    c.font="10px "+CFONT; c.textBaseline="top"; c.textAlign="left";
    let lx=gx;
    ss.forEach(s=>{
      c.fillStyle=s.color; c.beginPath(); c.arc(lx+4, gy-10, 4, 0, 7); c.fill();
      const txt=s.label+(s.unit?" "+s.unit:"");
      c.fillStyle=col.sub; c.fillText(txt, lx+12, gy-15);
      lx += 12 + c.measureText(txt).width + 14;
    });
  }

  // なぞった位置（1つ目の系列の点に合わせ、他の系列も同じ日付で拾う）
  let picked=null;
  if(hoverX!=null){
    let bd=Infinity, bdate=null;
    ss[0].pts.forEach(p=>{ const d=Math.abs(X(p.date)-hoverX); if(d<bd){ bd=d; bdate=p.date; } });
    if(bdate!=null){
      const px=X(bdate);
      c.strokeStyle=col.sub; c.lineWidth=1; c.setLineDash([3,3]);
      c.beginPath(); c.moveTo(px,gy); c.lineTo(px,gy+gh); c.stroke(); c.setLineDash([]);
      picked={date:bdate, vals:[]};
      ss.forEach(s=>{
        const p=s.pts.reduce((a,b)=> Math.abs(T(b.date)-T(bdate))<Math.abs(T(a.date)-T(bdate))?b:a, s.pts[0]);
        picked.vals.push({v:p.v, unit:s.unit, color:s.color});
        c.fillStyle=col.card; c.beginPath(); c.arc(X(p.date), s.ax.Y(p.v), 6, 0, 7); c.fill();
        c.strokeStyle=s.color; c.lineWidth=2.5; c.beginPath(); c.arc(X(p.date), s.ax.Y(p.v), 5, 0, 7); c.stroke();
      });
    }
  }
  renderPeriod(ss, picked);
}
function dailySeries(m, rows){
  return (rows||data).filter(e=>val(e,m)!=null).map(e=>({date:e.date, v:val(e,m)})).sort((a,b)=>a.date<b.date?-1:1);
}
// グラフの上の行。ふだんは「期間と増減」、なぞっている間はその日の値。
// X軸だけでは年が分からないので、ここで期間を明示する。
function renderPeriod(ss, picked){
  const el=document.getElementById("period");
  if(!ss || !ss.length){ el.textContent=""; return; }
  const jp=d=>`${d.slice(0,4)}/${+d.slice(5,7)}/${+d.slice(8,10)}`;

  if(picked){
    el.innerHTML=`<b>${jp(picked.date)}</b>　`
      + picked.vals.map(v=>`<b style="font-size:16px;color:${v.color}">${r2(v.v)}</b>${v.unit}`).join("　");
    return;
  }
  const p0=ss[0].pts, from=p0[0].date, to=p0[p0.length-1].date;
  const diff=ss.map(s=>{
    const d=s.pts[s.pts.length-1].v - s.pts[0].v;
    return `<b style="color:${s.color}">${d>0?"+":""}${r2(d)}${s.unit}</b>`;
  }).join("　");
  el.innerHTML=`${jp(from)} 〜 ${jp(to)}　${diff}`;
}

// ---- 入力・操作 ----
document.getElementById("i-date").value=todayStr();
function upsert(date,w,f){
  const i=data.findIndex(e=>e.date===date);
  const rec={date, w, f:(f===""||f==null||isNaN(f))?null:+f};
  if(i>=0) data[i]=rec; else data.push(rec);
}
document.getElementById("add").onclick=()=>{
  const d=document.getElementById("i-date").value;
  const w=parseFloat(document.getElementById("i-w").value);
  const fRaw=document.getElementById("i-f").value;
  const hint=document.getElementById("hint");
  if(!d || isNaN(w)){ hint.textContent="日付と体重は必須です。"; return; }
  const existed=data.some(e=>e.date===d);
  upsert(d, r2(w), fRaw);
  document.getElementById("i-w").value=""; document.getElementById("i-f").value="";
  hint.textContent = existed? `${d} を更新しました。` : `${d} を記録しました。`;
  render();
};
document.getElementById("list").onclick=e=>{
  const b=e.target.closest(".del"); if(!b) return;
  data=data.filter(x=>x.date!==b.dataset.d); render();
};
// メトリック / 粒度 切替
document.getElementById("metric").onclick=e=>{
  const b=e.target.closest("button"); if(!b)return;
  const m=b.dataset.m, i=metrics.indexOf(m);
  if(i>=0){ if(metrics.length>1) metrics.splice(i,1); }      // 最後の1つは外せない
  else { metrics.push(m); if(metrics.length>2) metrics.shift(); }  // 3つ目は古いほうと入れ替え
  [...e.currentTarget.children].forEach(x=>x.classList.toggle("on", metrics.includes(x.dataset.m)));
  drawChart(); };
document.getElementById("gran").onclick=e=>{ const b=e.target.closest("button"); if(!b)return;
  gran=b.dataset.g; [...e.currentTarget.children].forEach(x=>x.classList.toggle("on",x===b)); drawChart(); };
document.getElementById("range").onclick=e=>{ const b=e.target.closest("button"); if(!b)return;
  range=b.dataset.r; [...e.currentTarget.children].forEach(x=>x.classList.toggle("on",x===b)); drawChart(); };

// 設定
function fillSettings(){ document.getElementById("s-h").value=set.h; document.getElementById("s-wmax").value=set.wmax;
  document.getElementById("s-fmax").value=set.fmax; document.getElementById("s-ffmi").value=set.ffmi;
  document.getElementById("s-sc").value=set.sc??DEF_SET.sc; }
document.getElementById("save-set").onclick=()=>{
  set.h=+document.getElementById("s-h").value||DEF_SET.h;
  set.wmax=+document.getElementById("s-wmax").value||DEF_SET.wmax;
  set.fmax=+document.getElementById("s-fmax").value||DEF_SET.fmax;
  set.ffmi=+document.getElementById("s-ffmi").value||DEF_SET.ffmi;

// ---- Health Planet 取込（テスト対象・ここから） ----
// ショートカットが渡した Health Planet API の生レスポンス(JSON)を {date,w,f} の配列に畳む。
// tag 6021=体重 / 6022=体脂肪率（この2つしか API から返らない）。
// 同じ日に複数の測定があれば「その日の最初」を採る（朝の測定を拾うため。
// healthplanet.py の --pick first と同じ）。
function parseHP(json){
  const out={rows:[], height:null, error:null};
  let p;
  try{ p = (typeof json==="string") ? JSON.parse(json) : json; }
  catch(e){ out.error="JSONとして読めませんでした"; return out; }
  if(!p || typeof p!=="object" || Array.isArray(p)){ out.error="JSONとして読めませんでした"; return out; }
  if(p.error){ out.error="APIがエラーを返しています（"+p.error+"）"; return out; }
  if(!Array.isArray(p.data)){ out.error="data がありません"; return out; }

  const h=parseFloat(p.height);
  if(isFinite(h) && h>0) out.height=h;

  // 測定時刻ごとにタグをまとめる
  const byTs={};
  for(const row of p.data){
    if(!row || typeof row!=="object") continue;
    const ts=String(row.date ?? "");
    if(!/^\d{12}$/.test(ts)) continue;          // YYYYMMDDHHMM 以外は捨てる
    const v=parseFloat(row.keydata);
    if(!isFinite(v)) continue;
    (byTs[ts] ??= {})[String(row.tag ?? "")]=v;
  }

  // 日付ごとに畳む（時刻の昇順で回し、その日の最初だけ採る）
  const byDay={};
  for(const ts of Object.keys(byTs).sort()){
    const day=`${ts.slice(0,4)}-${ts.slice(4,6)}-${ts.slice(6,8)}`;
    if(byDay[day]) continue;
    const w=byTs[ts]["6021"];
    if(!isFinite(w)) continue;                  // 体重の無い測定は採らない
    const f=byTs[ts]["6022"];
    byDay[day]={date:day, w:Math.round(w*100)/100, f:isFinite(f)?Math.round(f*10)/10:null};
  }
  out.rows=Object.keys(byDay).sort().map(d=>byDay[d]);
  return out;
}

// 既存データへマージする。同じ日付は上書き。
// ただし体脂肪は「既にあって新データに無い」場合だけ既存を残す（欠測で消さない）。
function mergeHP(rows, cur){
  const next=cur.slice(); let added=0, updated=0;
  for(const r of rows){
    const i=next.findIndex(e=>e.date===r.date);
    if(i<0){ next.push({date:r.date, w:r.w, f:r.f}); added++; continue; }
    const f=(r.f==null && next[i].f!=null) ? next[i].f : r.f;
    if(next[i].w!==r.w || next[i].f!==f) updated++;
    next[i]={date:r.date, w:r.w, f};
  }
  return {data:next, added, updated};
}
// ---- Health Planet 取込（テスト対象・ここまで） ----

function applyHP(text){
  const hint=document.getElementById("hint");
  const res=parseHP(text);
  if(res.error){ hint.textContent="取り込めませんでした："+res.error; return; }
  if(!res.rows.length){ hint.textContent="取り込めるデータがありませんでした。"; return; }
  const m=mergeHP(res.rows, data);
  data=m.data;

  // 身長：設定が既定値のまま（＝自分で入れていない）ときだけ体組成計の値を採る。
  // 自分で入れた設定は黙って書き換えない。食い違うときは知らせるだけにする。
  let note="";
  if(res.height && Math.abs(res.height-set.h)>0.01){
    if(Math.abs(set.h-DEF_SET.h)<0.01){
      set.h=res.height; fillSettings();
      note=` 身長を ${r1(res.height)}cm に合わせました。`;
    }else{
      note=` 体組成計の身長は ${r1(res.height)}cm です（設定は ${r1(set.h)}cm）。`;
    }
  }
  const same=res.rows.length-m.added-m.updated;
  hint.textContent=`${res.rows.length}件を読み込みました（新規 ${m.added}・更新 ${m.updated}・変更なし ${same}）。`+note;
  render();
}

// ショートカットを呼ぶ（PWA 起点の場合）
document.getElementById("sync").onclick=()=>{
  const name=String(set.sc||"").trim();
  if(!name){ document.getElementById("hint").textContent="設定に「ショートカット名」を入れてください。"; return; }
  location.href="shortcuts://run-shortcut?name="+encodeURIComponent(name);
};

// CSV
document.getElementById("export").onclick=()=>{
  const head="date,weight,fat\n";
  const body=[...data].sort((a,b)=>a.date<b.date?-1:1)
    .map(e=>`${e.date},${e.w},${e.f??""}`).join("\n");
  const blob=new Blob([head+body],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`weight_${todayStr()}.csv`; a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById("import").onchange=ev=>{
  const file=ev.target.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{
    const lines=rd.result.split(/\r?\n/).filter(x=>x.trim());
    let added=0;
    for(const ln of lines){
      const [d,w,f]=ln.split(",").map(s=>s.trim());
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) continue;      // ヘッダ・不正行を飛ばす
      if(isNaN(parseFloat(w))) continue;
      upsert(d, r2(+w), f); added++;
    }
    ev.target.value="";
    document.getElementById("hint").textContent=`${added}件を取り込みました。`;
    render();
  };
  rd.readAsText(file);
};

// グラフを指でなぞると、その日の値を上に出す（離すと期間表示に戻る）
let hoverX=null;
(function(){
  const cv=document.getElementById("chart");
  const at=ev=>{
    const t=ev.touches && ev.touches[0] ? ev.touches[0] : ev;
    hoverX=t.clientX-cv.getBoundingClientRect().left;
    drawChart();
  };
  const off=()=>{ if(hoverX!==null){ hoverX=null; drawChart(); } };
  cv.addEventListener("mousemove", at);
  cv.addEventListener("mouseleave", off);
  // 縦スクロールを奪わないよう、横に動かしている間だけ拾う
  let sx=null, sy=null, tracking=false;
  cv.addEventListener("touchstart", e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; tracking=false; }, {passive:true});
  cv.addEventListener("touchmove", e=>{
    const dx=Math.abs(e.touches[0].clientX-sx), dy=Math.abs(e.touches[0].clientY-sy);
    if(!tracking && dx>6 && dx>dy) tracking=true;
    if(tracking){ e.preventDefault(); at(e); }
  }, {passive:false});
  cv.addEventListener("touchend", off);
  cv.addEventListener("touchcancel", off);
})();

window.addEventListener("resize", drawChart);
fillSettings();
render();

// 起動時：ショートカットが付けた #hp=... を読む（ショートカット起点の場合）
(function(){
  const h=location.hash||"";
  if(!h.startsWith("#hp=")) return;
  let text;
  try{ text=decodeURIComponent(h.slice(4)); }
  catch(e){ document.getElementById("hint").textContent="URLを読めませんでした。"; return; }
  // 二重取り込みを防ぐため、読んだらフラグメントを消す（file:// では失敗しうるので握りつぶす）
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){ location.hash=""; }
  applyHP(text);
})();
